name: Build and Push Docker Image

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Check Docker Hub credentials
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "${DOCKERHUB_USERNAME:-}" ] || [ -z "${DOCKERHUB_TOKEN:-}" ]; then
            echo "::error::Docker Hub credentials are missing. Configure repository variable DOCKERHUB_USERNAME and secret DOCKERHUB_TOKEN."
            exit 1
          fi

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/s13gyan-docker-practice-lab:latest
            ${{ vars.DOCKERHUB_USERNAME }}/s13gyan-docker-practice-lab:${{ github.sha }}

      - name: Pull published image
        env:
          IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/s13gyan-docker-practice-lab:${{ github.sha }}
        run: docker pull "$IMAGE"

      - name: Start and show container
        env:
          IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/s13gyan-docker-practice-lab:${{ github.sha }}
        run: |
          docker run --detach --name docker-practice-lab --publish 3000:3000 "$IMAGE"
          for attempt in $(seq 1 15); do
            if curl --fail --silent --output /dev/null http://127.0.0.1:3000/api/health; then
              echo "Container is running; app health endpoint responded:"
              curl --fail --silent --show-error http://127.0.0.1:3000/api/health
              echo
              docker ps --filter "name=^/docker-practice-lab$" --format "table {{.ID}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}\t{{.Names}}"
              exit 0
            fi
            sleep 2
          done
          docker logs docker-practice-lab
          docker ps -a --filter "name=^/docker-practice-lab$" --format "table {{.ID}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}\t{{.Names}}"
          exit 1
