name: Docker Build

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build --tag docker-practice-lab:${{ github.sha }} .

      - name: Show built Docker image
        run: docker image ls docker-practice-lab:${{ github.sha }}
